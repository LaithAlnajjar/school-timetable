[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "school-timetable"
version = "1.0.0"
description = "Offline weekly school timetable planner"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.10.2", "ortools==9.15.6755", "openpyxl==3.1.5"]

[project.scripts]
school-timetable = "school_timetable.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
school_timetable = ["resources/*.md", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
