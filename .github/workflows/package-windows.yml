name: Package Windows
on:
  workflow_dispatch:
  push:
    branches: [codex/integration]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/bundle_licenses.py'
      - 'scripts/check_packaged.py'
      - 'scripts/launch.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/package-windows.yml'
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Test, build folder, smoke, ZIP, extract and smoke again
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python (Get-Command python).Source
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SchoolTimetable-windows-x64
          path: dist/SchoolTimetable-1.0.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: packaged-smoke-reports
          path: |
            build/packaged-smoke/smoke-report.json
            build/extracted-smoke/smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
